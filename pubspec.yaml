name: market_salla
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  carousel_slider: ^5.0.0
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.6
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  gal: ^2.3.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.2
  image_cropper: ^11.0.0
  gap: ^3.0.1
  auto_size_text: ^3.0.0
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  supabase_flutter: ^2.12.0
  loading_animation_widget: ^1.2.0
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  get_it: ^9.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/icon.png"


flutter:


  uses-material-design: true

  
  assets:
    - assets/img/
    - assets/img/icons/
    - assets/img/category/
    - assets/img/panner/
    - assets/img/product/dairy/
    - assets/img/product/fruits/
    - assets/img/product/laundry/
    - assets/img/product/vegetables/
    - assets/img/product/protiens/
    - assets/img/loginmethods/
    - assets/img/onboarding/
    - assets/img/logo/
    






